<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endless Runner</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    #ui {
      position: fixed;
      /* 👈 IMPORTANT (was absolute) */
      top: 0;
      left: 0;
      width: 100vw;
      /* 👈 force full width */
      height: 100vh;
      /* 👈 force full height */
      z-index: 10;
      pointer-events: auto;
    }

    /* Top score bar */
    #topBar {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
    }

    #score {
      font-size: 32px;
      color: white;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
    }

    /* Game Over Screen */
    #gameOverScreen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      display: none;
      text-align: center;

      background: rgba(0, 0, 0, 0.8);
      /* 👈 makes it visible */
      padding: 20px;
      border-radius: 10px;

      pointer-events: auto;
    }

    #gameOverScreen h1 {
      color: red;
      font-size: 48px;
      margin-bottom: 10px;
    }

    #gameOverScreen p {
      color: white;
      font-size: 24px;
    }

    #restartBtn {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      background: white;
      cursor: pointer;
      border-radius: 8px;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    #coins {
      font-size: 24px;
      color: yellow;
      margin-top: 5px;
      text-shadow: 0 0 10px black;
    }

    #homeBtn {
      margin-top: 12px;
      padding: 10px 18px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #4caf50, #2e7d32);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #homeBtn:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #66bb6a, #388e3c);
    }

    #homeBtn:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <div id="topBar">
      <div id="score">0</div>
      <div id="coins">0</div>
    </div>

    <div id="gameOverScreen">
      <h1>Game Over</h1>
      <p id="finalScore"></p>
      <button id="restartBtn">Restart</button>
      <button id="homeBtn">🏠 Back to Home</button>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
