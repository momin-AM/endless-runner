<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endless Runner</title>
  <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }

  body {
    overflow: hidden;
    background: black;
    touch-action: none;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1;
  }

  #ui {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
  }

  /* 🔝 TOP BAR */
  #topBar {
    position: absolute;
    top: 12px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 16px;
  }

  #score, #coins {
    background: rgba(26, 23, 23, 0.5);
    padding: 8px 14px;
    border-radius: 12px;
    font-weight: bold;
    text-shadow: 0 0 10px black;
  }

  #score {
    font-size: 22px;
    color: white;
  }

  #coins {
    font-size: 20px;
    color: #ffd700;
  }

  /* 🎮 GAME OVER */
  #gameOverScreen {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    display: none;
    flex-direction: column;
    align-items: center;

    background: rgba(0,0,0,0.85);
    padding: 25px;
    border-radius: 16px;

    pointer-events: auto;
  }

  #gameOverScreen h1 {
    color: #ff4d4d;
    font-size: 28px;
    margin-bottom: 10px;
  }

  #gameOverScreen p {
    font-size: 18px;
    margin-bottom: 15px;
  }
  #finalScore{
    color: #00ff88;
  }
  button {
    padding: 12px 20px;
    margin: 6px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  #restartBtn {
    background: #00ff88;
    color: black;
  }

  #homeBtn {
    background: white;
    color: black;
  }

  /* 📱 EXTRA MOBILE */
  @media (max-width: 480px) {
    #score {
      font-size: 18px;
    }

    #coins {
      font-size: 16px;
    }

    #gameOverScreen h1 {
      font-size: 24px;
    }
  }
</style>
</head>

<body>
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <div id="topBar">
      <div id="score">0</div>
      <div id="coins">0</div>
    </div>

    <div id="gameOverScreen">
      <h1>Game Over</h1>
      <p id="finalScore"></p>
      <button id="restartBtn">Restart</button>
      <button id="homeBtn">🏠 Back to Home</button>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
